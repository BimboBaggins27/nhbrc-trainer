<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b6e3f" />
<meta name="description" content="Learn NHBRC and SANS 10400 — South African National Building Regulations on your phone." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NHBRC Trainer" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<title>NHBRC Trainer — SA Building Regs</title>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="iconbtn hidden" aria-label="Back">&larr;</button>
    <h1 id="title">NHBRC Trainer</h1>
    <button id="installBtn" class="iconbtn hidden" aria-label="Install">Install</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-route="home" class="tab active">Learn</button>
    <button data-route="library" class="tab">Library</button>
    <button data-route="quiz" class="tab">Quiz</button>
    <button data-route="glossary" class="tab">Glossary</button>
    <button data-route="progress" class="tab">Progress</button>
  </nav>

  <script src="data.js"></script>
  <script src="library.js"></script>
  <script src="license.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
